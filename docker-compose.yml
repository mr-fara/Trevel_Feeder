services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: travels_feeder
      POSTGRES_USER: travels_feeder
      POSTGRES_PASSWORD: travels_feeder
    ports:
      - "5433:5432"
    volumes:
      - travels_feeder_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travels_feeder -d travels_feeder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travels_feeder_db:
